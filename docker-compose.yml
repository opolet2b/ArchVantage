services:
  chatbotn:
    image: semantic-canvas:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BASE_PATH=/semantic-canvas
    ports:
      - "3000:3000"
      - "8001:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/data_storage:/app/backend/data_storage
      - ./backend/chroma_db:/app/backend/chroma_db
      - sqlite_data:/app/backend/db
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=sqlite:///./db/sql_app.db
      - NEXT_PUBLIC_API_URL=/semantic-canvas/api/v1
      - NEXT_PUBLIC_BASE_PATH=/semantic-canvas
      - ARCADEDB_HOST=http://arcadedb:2480
      - OLLAMA_HOST=http://192.168.30.35:11434
      - OLLAMA_URL=http://192.168.30.35:11434
      - OPENAI_BASE_URL=http://192.168.30.35:11434/v1
      - OPENAI_API_KEY=sk-dummy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - arcadedb

  arcadedb:
    image: arcadedata/arcadedb:latest
    ports:
      - "2480:2480"
      - "2424:2424"
    environment:
      - JAVA_OPTS=-Darcadedb.server.rootPassword=playwithdata -Darcadedb.server.defaultDatabases=KnowledgeGraph
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    restart: unless-stopped

volumes:
  sqlite_data:
  arcadedb_data:
